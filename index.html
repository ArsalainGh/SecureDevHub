<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureDevHub — Write Code. Ship Secure.</title>
    <meta
      name="description"
      content="A free, open-source security guide for web developers. Learn the vulnerabilities that take sites down, fix them with real code, and never ship insecure code again."
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="author" content="SecureDevHub" />
    <link rel="canonical" href="https://securedevhub.dev/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecureDevHub" />
    <meta property="og:title" content="SecureDevHub — Write Code. Ship Secure." />
    <meta
      property="og:description"
      content="A free, open-source security guide for web developers. 16 modules, 5 checklists, 30+ tools — 100% free."
    />
    <meta property="og:url" content="https://securedevhub.dev/" />
    <meta property="og:image" content="https://securedevhub.dev/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SecureDevHub — Write Code. Ship Secure." />
    <meta
      name="twitter:description"
      content="A free, open-source security guide for web developers. Learn vulnerabilities, fix them, ship secure."
    />

    <!-- Favicon (inline shield) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E"
    />

    <!-- Bootstrap 5.3.8 (latest) via CDN with SRI -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Fonts: Inter (UI) + JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SecureDevHub",
        "url": "https://securedevhub.dev/",
        "description": "A free, open-source security guide for web developers.",
        "publisher": { "@type": "Organization", "name": "SecureDevHub" }
      }
    </script>

    <!-- Theme init: runs before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("sdh_theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.setAttribute("data-bs-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
